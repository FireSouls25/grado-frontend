# CI frontend: check, contrato y build en cada push a main y en PRs.
# Usa el mismo Node que desarrollo (26.7.0); exceljs se queda en 4.4.0
# (nunca `npm audit fix --force`: la baja a 3.x y rompe la exportación).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.fractalschool.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:contract
      - run: npm run build
