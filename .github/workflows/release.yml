# Release frontend: solo corre en tags v* cuyo commit YA pasó CI en main.
# linux/windows/Android publican el Release de una vez; macOS es
# oportunista (needs: publish): cuando consigue runner, adjunta sus
# artefactos al Release ya existente con `gh release upload`. Si el job
# macOS se cancela por falta de capacidad, el Release queda válido igual.
# iOS sigue fuera: el build real exige certificados Apple.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          CONC=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')
          echo "CI conclusion for $SHA: $CONC"
          if [ "$CONC" != "success" ]; then
            echo "El tag debe apuntar a un commit con CI verde en main."
            exit 1
          fi

  desktop:
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: "--bundles deb,appimage"
          - os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_URL: https://api.fractalschool.app
    steps:
      - uses: actions/checkout@v4
      # Tauri desktop en Linux enlaza webkitgtk del sistema: sin estos
      # headers el build Rust (glib-sys) falla en pkg-config.
      - if: matrix.os == 'ubuntu-latest'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # La versión sale del tag (v0.1.4 -> 0.1.4): tauri.conf.json queda en
      # 0.1.0 en el repo y solo se reescribe en el runner.
      - name: Versión desde el tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$V"
          echo "Versión: $V"
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error

  android:
    needs: [gate]
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.fractalschool.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # setup-android@v3 quedó obsoleto: invoca `sdkmanager tools`, paquete
      # que ya no existe en cmdline-tools modernos y falla con exit 1.
      # Instalación manual con versiones fijadas en su lugar.
      - run: |
          set -e
          SDK="$HOME/Android/Sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses
          sdkmanager --sdk_root="$SDK" \
            "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;34.0.0" "build-tools;35.0.0" "ndk;25.1.8937393"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/25.1.8937393" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # La versión sale del tag (v0.1.4 -> 0.1.4): tauri.conf.json queda en
      # 0.1.0 en el repo y solo se reescribe en el runner.
      - name: Versión desde el tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$V"
          echo "Versión: $V"
      - run: npx tauri android init
      # Release sin firma propia por ahora: se firma con la clave debug
      # (instalable a mano, no publicable en Play). Para Play hará falta
      # keystore real en secrets (ver comentario en el parche).
      - run: |
          set -e
          python3 - <<'EOF'
          p = 'src-tauri/gen/android/app/build.gradle.kts'
          s = open(p).read()
          old = 'getByName("release") {\n            isMinifyEnabled = true'
          new = ('getByName("release") {\n'
                 '            signingConfig = signingConfigs.getByName("debug")\n'
                 '            isMinifyEnabled = true')
          assert old in s, 'plantilla cambió: revisar parche'
          s = s.replace(old, new, 1)
          open(p, 'w').write(s)
          print('release firmado con clave debug')
          EOF
      - run: |
          set -e
          # El runner trae ANDROID_SDK_ROOT=/usr/local/lib/android/sdk mientras
          # este job instala su SDK en ANDROID_HOME: Gradle 8 falla con dos
          # rutas distintas, así que se deja una sola.
          unset ANDROID_SDK_ROOT
          npx tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    needs: [gate, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      # Sin checkout no hay .git: gh necesita el repo explícito (GH_REPO).
      # Cada instalador se renombra a fractal-school-<plataforma>-<versión>.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          mkdir release
          pick() { # pick <patrón> <nombre destino>: exige exactamente un archivo
            mapfile -t F < <(find dist-artifacts -type f -name "$1")
            [ "${#F[@]}" -eq 1 ] || { echo "Se esperaba 1 archivo '$1', hay ${#F[@]}: ${F[*]}"; exit 1; }
            cp "${F[0]}" "release/$2"
          }
          pick '*.deb'        "fractal-school-linux-x86_64-$V.deb"
          pick '*.AppImage'   "fractal-school-linux-x86_64-$V.AppImage"
          pick '*-setup.exe'  "fractal-school-windows-x86_64-$V.exe"
          pick '*.apk'        "fractal-school-android-$V.apk"
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --generate-notes

  # macOS oportunista: corre DESPUÉS de publish y adjunta sus artefactos
  # al Release ya existente. Si no hay runners, se cancela sin afectar
  # lo publicado.
  desktop-macos:
    needs: [publish]
    runs-on: macos-latest
    env:
      VITE_API_URL: https://api.fractalschool.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      # La versión sale del tag (v0.1.4 -> 0.1.4): tauri.conf.json queda en
      # 0.1.0 en el repo y solo se reescribe en el runner.
      - name: Versión desde el tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const f="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$V"
          echo "Versión: $V"
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin --bundles dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "fractal-school-macos-universal-$V.dmg"
          gh release upload "$GITHUB_REF_NAME" \
            "fractal-school-macos-universal-$V.dmg" --clobber
