<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <!-- Baseline CSP (base reforzada en Cloudflare con la misma
      política como cabecera, donde sí valen frame-ancestors y
      report-uri). %VITE_API_URL% lo sustituye Vite en el build;
      vacío significa mismo origen y basta 'self'. Permite: JS propio,
      estilos propios + inline (Svelte aplica style: como atributos),
      workers blob: del HMR solo en dev, fotos en data:, y la API.
      Sin terceros ni inline JS. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' %VITE_API_URL% https://static.cloudflareinsights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b6c80'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-weight='700' font-size='18' text-anchor='middle' fill='%23ffffff'%3EG%3C/text%3E%3C/svg%3E" />
    <title>Observador Estudiantil</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
