<!doctype html>
<html lang="es">
  <head>
    <!-- Fuentes críticas antes del primer pintado: evita el destello
      de texto (FOUT) que choca con las animaciones de entrada. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-400-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-600-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <!-- Baseline CSP (base reforzada en Cloudflare con la misma
      política como cabecera, donde sí valen frame-ancestors y
      report-uri). %VITE_API_URL% lo sustituye Vite en el build;
      vacío significa mismo origen y basta 'self'. Permite: JS propio,
      estilos propios + inline (Svelte aplica style: como atributos),
      workers blob: del HMR solo en dev, fotos en data:, y la API.
      Sin terceros ni inline JS. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' %VITE_API_URL% https://static.cloudflareinsights.com https://cloudflareinsights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b6c80'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-weight='700' font-size='18' text-anchor='middle' fill='%23ffffff'%3EG%3C/text%3E%3C/svg%3E" />
    <title>Observador Estudiantil · Colegio Nuestra Señora de Guadalupe</title>
    <meta
      name="description"
      content="Sistema institucional de seguimiento estudiantil del Colegio Nuestra Señora de Guadalupe (Colombia): asistencia, llamados, convivencia, horarios e historial. Acceso solo para personal del colegio."
    />
    <meta name="application-name" content="Observador Estudiantil" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fractal School" />
    <meta property="og:title" content="Observador Estudiantil · Colegio Nuestra Señora de Guadalupe" />
    <meta
      property="og:description"
      content="Sistema institucional de seguimiento estudiantil. Las cuentas las crea el colegio; no hay registro abierto."
    />
    <meta property="og:locale" content="es_CO" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <main style="max-width: 640px; margin: 48px auto; padding: 0 16px; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Observador Estudiantil</h1>
        <p>
          Sistema institucional de seguimiento estudiantil del <strong>Colegio Nuestra Señora de Guadalupe</strong>
          (Colombia): asistencia, llamados de atención, convivencia, horarios e historial de cada estudiante.
        </p>
        <p>
          El acceso es solo para personal del colegio: las cuentas las crea la institución y no hay registro abierto.
          Esta aplicación necesita JavaScript.
        </p>
        <p>
          <a href="/privacidad.html">Política de privacidad</a> ·
          <a href="mailto:contacto@fractalschool.app">contacto@fractalschool.app</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
